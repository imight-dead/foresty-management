<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foresty Management</title>
<meta name="description" content="Foresty Laboratory internal system — work programs, division tasks, agenda, and the member directory.">
<link rel="icon" href="assets/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foresty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@800&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/opening.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-fp" viewBox="0 0 100 100">
      <g fill="none" stroke="#E4181A" stroke-width="2.4" stroke-linecap="round">
        <path d="M50 6C28 6 10 24 10 46v10"/><path d="M90 46c0-22-18-40-40-40"/>
        <path d="M20 66c2-6 3-13 3-20 0-15 12-27 27-27s27 12 27 27c0 9-1 17-3 25"/>
        <path d="M33 78c3-8 5-19 5-32a12 12 0 0 1 24 0c0 13-1 23-4 32"/>
        <path d="M50 34v12"/><path d="M50 54c0 12-1 22-4 32"/>
        <path d="M66 60c0 10-1 20-3 28"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="shell" hidden>
  <aside id="sidebar">
    <div class="brand">
      <img src="assets/logo.png" alt="Foresty Laboratory logo" width="34" height="48">
      <div class="btxt">
        <div class="bt">FORESTY<br>LABORATORY</div>
        <div class="bs">Forensics &amp; Security</div>
      </div>
    </div>
    <div class="rule live sideline"></div>
    <div class="kick sidekick">Foresty Management System · 26/27</div>
    <nav id="nav" aria-label="Main menu"></nav>
    <button class="railtoggle" id="rail" aria-label="Collapse menu" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="ntxt">Collapse</span>
    </button>
  </aside>
  <div id="sideScrim" hidden></div>

  <div id="main">
    <header id="topbar">
      <button class="hamb" id="hamb" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <span class="pr" aria-hidden="true">&gt;</span>
        <input id="q" type="search" placeholder="search program / division / member..." autocomplete="off" aria-label="Search">
        <div class="results" id="results" hidden></div>
      </div>
      <div class="tb-right">
        <button class="bell" id="bell" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="badge" id="bellCount" hidden>0</span>
        </button>
        <div class="me" id="me"></div>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="authRoot"></div>
<div id="modalRoot"></div>

<script src="js/opening.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
