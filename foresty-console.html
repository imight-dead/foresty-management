<title>Foresty Lab Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#050505; --bg2:#0A0A0A;
  --surface:#121212; --surface2:#161616;
  --line:#242424;
  --red:#E4181A; --red-dim:#D91E24; --maroon:#4A0000; --maroon-2:#2B0000;
  --fg:#FFFFFF; --muted:#B3B3B3; --dim:#8A8A8A;
  --ok:#3FBF6F; --warn:#FFB020;
  --edge:rgba(228,24,26,.4);
  --glow:0 0 12px rgba(228,24,26,.5);
  --disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono","Consolas","Courier New",monospace;
  --cut-btn:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  --cut-tag:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);
  --sidebar:246px;
}
*{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
img,svg{max-width:100%}
html{color-scheme:dark}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--mono);font-size:13.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(22px,3.4vw,34px);line-height:1.1}
h2{font-size:17px;letter-spacing:.14em}
h3{font-size:15px;letter-spacing:.1em}
h4{font-size:12.5px;letter-spacing:.12em}
a{color:var(--red);text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0c0c0c}
::-webkit-scrollbar-thumb{background:#3a0d0d;border:1px solid #000}
::-webkit-scrollbar-thumb:hover{background:var(--maroon)}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100vh;background:
  radial-gradient(1100px 620px at 100% 0%, #3A0000 0%, rgba(58,0,0,0) 62%),
  radial-gradient(900px 700px at 0% 100%, #1e0000 0%, rgba(30,0,0,0) 60%),
  var(--bg);}
#sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,#0b0505 0%,#050505 60%);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}
.brand img{width:34px;height:auto;flex:0 0 34px;display:block}
#shell.rail .brand img{width:30px}
.brand .bt{font-family:var(--disp);font-weight:700;letter-spacing:.13em;font-size:14px;line-height:1.15}
.brand .bs{font-size:9.5px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase}
.labshow{
  display:inline-block;margin:14px 16px 4px;padding:3px 13px 3px 10px;background:var(--red);
  color:#fff;font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.2em;
  clip-path:var(--cut-tag);
}
nav{padding:10px 0;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 16px;color:var(--muted);
  font-size:12px;letter-spacing:.09em;text-transform:uppercase;position:relative;
  border-left:2px solid transparent;transition:.14s;width:100%;text-align:left;
}
.nav-item .ic{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav-item:hover{color:#fff;background:rgba(228,24,26,.07)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(228,24,26,.22),rgba(228,24,26,0));border-left-color:var(--red)}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:0 6px;font-weight:700;clip-path:var(--cut-tag)}
.railtoggle{display:flex;align-items:center;gap:11px;padding:9px 16px;color:var(--dim);
  border-top:1px solid var(--line);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  font-family:var(--disp);font-weight:600;transition:.14s}
.railtoggle:hover{color:#fff;background:rgba(228,24,26,.08)}
.railtoggle svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .18s ease}

/* mode rail: hanya ikon */
#shell.rail{--sidebar:62px}
#shell.rail .brand{padding:18px 0;justify-content:center;gap:0}
#shell.rail .btxt{display:none}
#shell.rail .labshow{display:none}
#shell.rail nav{border-top:1px solid var(--line);margin-top:0}
#shell.rail nav{padding:10px 0}
#shell.rail .nav-item{justify-content:center;padding:12px 0;gap:0;border-left-width:0;border-right:2px solid transparent}
#shell.rail .nav-item.active{border-right-color:var(--red);background:rgba(228,24,26,.16)}
#shell.rail .ntxt{display:none}
#shell.rail .nav-item .cnt{position:absolute;top:5px;right:7px;margin:0;padding:0 4px;font-size:9px}
#shell.rail .railtoggle{justify-content:center;padding:10px 0;gap:0}
#shell.rail .railtoggle svg{transform:rotate(180deg)}
#shell.rail .sidefoot{display:none}
.sidefoot{padding:12px 16px;border-top:1px solid var(--line);font-size:10px;color:var(--dim);letter-spacing:.06em}
.sidefoot b{color:var(--red);font-weight:700}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:11px 22px;border-bottom:1px solid var(--line);background:rgba(5,5,5,.92);backdrop-filter:blur(8px);
}
.hamb{display:none;padding:6px;color:var(--muted)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#0d0d0d;padding:7px 11px;transition:.15s;position:relative}
.search:focus-within{border-color:var(--edge);box-shadow:var(--glow)}
.search .pr{color:var(--red);font-weight:700}
.search input{flex:1;background:none;border:0;color:#fff;outline:none;font-size:12.5px;min-width:0}
.search input::placeholder{color:#5c5c5c}
.results{position:absolute;top:calc(100% + 6px);left:-1px;right:-1px;background:#0d0d0d;border:1px solid var(--edge);
  box-shadow:var(--glow);max-height:330px;overflow-y:auto;z-index:50}
.results button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid #1c1c1c;font-size:12px}
.results button:hover{background:rgba(228,24,26,.12)}
.results .k{font-size:9px;letter-spacing:.2em;color:var(--red);text-transform:uppercase;font-family:var(--disp)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.bell{position:relative;padding:6px;color:var(--muted)}
.bell:hover{color:#fff}
.bell svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
.bell .badge{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px;clip-path:var(--cut-tag)}
.me{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line)}
.me .av{width:30px;height:30px;background:var(--maroon);border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:12px}
.me .mn{font-size:11.5px;line-height:1.25}
.me .mr{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}

#view{padding:24px 22px 60px;max-width:1360px;width:100%}
.sec-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.kick{font-size:10px;color:var(--red);letter-spacing:.3em;text-transform:uppercase;font-family:var(--disp);font-weight:600}
.sec-sub{color:var(--muted);font-size:12px;margin:3px 0 0;max-width:70ch}
.rule{height:1px;background:linear-gradient(90deg,var(--red),rgba(228,24,26,.12) 34%,var(--line) 34%,var(--line));margin:14px 0 22px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--edge);background:
  radial-gradient(700px 300px at 88% -30%, #5c0000 0%, rgba(92,0,0,0) 70%),
  linear-gradient(100deg,#0d0404 0%,#070707 55%,#120303 100%);
  padding:26px 24px;margin-bottom:26px}
.hero .dots{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(228,24,26,.55) 1px,transparent 1.1px);
  background-size:9px 9px;
  -webkit-mask-image:linear-gradient(105deg,rgba(0,0,0,.9),transparent 52%);
  mask-image:linear-gradient(105deg,rgba(0,0,0,.9),transparent 52%);opacity:.5}
.hero .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.hero .sweep{position:absolute;left:0;right:0;top:-90px;height:90px;pointer-events:none;
  background:linear-gradient(180deg,rgba(228,24,26,0),rgba(228,24,26,.10),rgba(228,24,26,0));animation:sweep 7s linear infinite}
@keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(calc(100% + 420px))}}
.hero .fp{position:absolute;right:-20px;bottom:-56px;width:236px;opacity:.1;pointer-events:none}
.hero-in{position:relative;display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.hero .lead{font-size:12.5px;color:var(--muted);max-width:56ch;margin:9px 0 0}
.cursor{display:inline-block;width:8px;height:1em;background:var(--red);animation:bl 1s steps(1) infinite;margin-left:2px;vertical-align:-2px}
@keyframes bl{50%{opacity:0}}
.hero-clock{text-align:right}
.hero-clock .t{font-size:26px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);padding:16px;transition:.16s}
.card::after{content:"";position:absolute;top:0;right:0;width:12px;height:12px;background:linear-gradient(225deg,var(--red) 0 50%,transparent 50%);opacity:.7}
.card.click{cursor:pointer;text-align:left;width:100%;display:block}
.card.click:hover{border-color:var(--edge);box-shadow:var(--glow);transform:translateY(-2px);background:var(--surface2)}
.card.click:hover::after{opacity:1}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(286px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.g-sum{grid-template-columns:repeat(auto-fit,minmax(186px,1fr))}
.dash{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}

.tag{display:inline-block;padding:2.5px 11px 2.5px 8px;font-size:9.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-family:var(--disp);clip-path:var(--cut-tag);white-space:nowrap}
.t-ongoing{background:rgba(228,24,26,.16);color:#ff5b5c;box-shadow:inset 0 0 0 1px var(--edge)}
.t-completed{background:rgba(63,191,111,.12);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(63,191,111,.38)}
.t-soon{background:rgba(138,138,138,.1);color:var(--dim);box-shadow:inset 0 0 0 1px #3a3a3a}
.t-over{background:var(--red);color:#fff}
.dot{width:7px;height:7px;background:var(--red);display:inline-block;margin-right:6px}
.dot.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(228,24,26,.6)}50%{opacity:.5;box-shadow:0 0 0 5px rgba(228,24,26,0)}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--disp);font-weight:700;
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--red);color:#fff;clip-path:var(--cut-btn);transition:.15s}
.btn:hover{background:#ff2b2d;box-shadow:var(--glow)}
.btn.ghost{background:#151515;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{color:#fff;box-shadow:inset 0 0 0 1px var(--edge),var(--glow)}
.btn.sm{padding:6px 12px;font-size:10.5px}

.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:9px 20px;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
  background:#101010;color:var(--dim);clip-path:var(--cut-btn);transition:.15s;box-shadow:inset 0 0 0 1px #222}
.tab:hover{color:#fff}
.tab.on{background:var(--red);color:#fff;box-shadow:none}
.tab .n{opacity:.75;font-family:var(--mono);font-size:10.5px}

.bar{height:5px;background:#1e1e1e;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--maroon),var(--red));transition:width .35s ease}
.bar.done i{background:linear-gradient(90deg,#17603a,var(--ok))}
.meta{display:flex;gap:7px;align-items:center;color:var(--dim);font-size:11px;flex-wrap:wrap}
.label{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-family:var(--disp);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.av-s{width:24px;height:24px;background:#1d0505;box-shadow:inset 0 0 0 1px var(--edge);display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:10px;color:#ff7a7b}

/* ---------- countdown ---------- */
.cd{display:flex;gap:4px;font-variant-numeric:tabular-nums}
.cd span{background:#0b0b0b;box-shadow:inset 0 0 0 1px #2a1010;padding:5px 7px;min-width:40px;text-align:center;font-size:15px;font-weight:700;line-height:1.15;color:var(--red)}
.cd span b{display:block;font-size:8px;color:var(--dim);font-weight:500;letter-spacing:.16em;font-family:var(--disp)}
.cd.urgent span{color:#fff;background:var(--maroon-2);box-shadow:inset 0 0 0 1px var(--red)}
.cd.past span{color:var(--dim)}

/* ---------- deadline list ---------- */
.dl{display:flex;flex-direction:column}
.dl-row{display:flex;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid #1b1b1b;flex-wrap:wrap;transition:.14s;text-align:left;width:100%}
.dl-row:hover{background:rgba(228,24,26,.06)}
.dl-row:last-child{border-bottom:0}
.dl-row .idx{font-size:10px;color:#4a4a4a;width:22px;flex:0 0 22px}
.dl-row .nm{flex:1;min-width:150px}
.dl-row .nm b{font-family:var(--disp);letter-spacing:.05em;font-size:13px;text-transform:uppercase;display:block}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head .mo{font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;flex:1}
.cal-nav{width:28px;height:28px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.cal-nav:hover{color:#fff;box-shadow:inset 0 0 0 1px var(--edge)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#1b1b1b;box-shadow:0 0 0 1px #1b1b1b}
.cal .dow{background:#0c0c0c;text-align:center;padding:6px 0;font-size:9px;letter-spacing:.16em;color:var(--dim);font-family:var(--disp);font-weight:600}
.cal .day{background:#0e0e0e;min-height:56px;padding:5px 6px;position:relative;text-align:left;font-size:11.5px;color:var(--muted);transition:.12s}
.cal .day:hover{background:#161616;color:#fff}
.cal .day.out{color:#3a3a3a;background:#090909}
.cal .day.today{box-shadow:inset 0 0 0 1px var(--red);color:#fff}
.cal .day.sel{background:rgba(228,24,26,.15);color:#fff}
.cal .day .marks{position:absolute;left:6px;bottom:6px;display:flex;gap:3px}
.cal .day .marks i{width:5px;height:5px;background:var(--red);display:block}
.cal .day .marks i.ok{background:var(--ok)}
.cal .day .marks i.soon{background:var(--dim)}
.day-detail{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.day-detail .ev{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #171717;width:100%;text-align:left}
.day-detail .ev:hover .evn{color:var(--red)}
.day-detail .ev:last-child{border-bottom:0}

/* ---------- checklist ---------- */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px;background:#0e0e0e;box-shadow:inset 0 0 0 1px #1d1d1d;
  width:100%;text-align:left;transition:.14s}
.chk:hover{box-shadow:inset 0 0 0 1px var(--edge)}
.chk .box{width:16px;height:16px;flex:0 0 16px;margin-top:2px;box-shadow:inset 0 0 0 1px #444;display:grid;place-items:center;transition:.14s}
.chk.on .box{background:var(--ok);box-shadow:none}
.chk.on .box svg{width:11px;height:11px;stroke:#04180d;stroke-width:3;fill:none}
.chk.on .t{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(228,24,26,.7)}
.chk .t{font-size:12.5px;line-height:1.45}
.chk .who{font-size:10px;color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:7px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(3px);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.modal{position:relative;width:min(880px,100%);background:var(--bg2);border:1px solid var(--edge);
  box-shadow:0 0 40px rgba(228,24,26,.18);animation:mo .18s ease-out}
@keyframes mo{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.modal-head{position:relative;overflow:hidden;padding:20px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(100deg,#150404,#0a0a0a 70%)}
.modal-head .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(228,24,26,.5) 1px,transparent 1.1px);
  background-size:8px 8px;-webkit-mask-image:linear-gradient(90deg,transparent 55%,#000);mask-image:linear-gradient(90deg,transparent 55%,#000);opacity:.45;pointer-events:none}
.modal-body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:20px}
.close{position:absolute;top:12px;right:12px;width:30px;height:30px;display:grid;place-items:center;
  background:#161616;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);z-index:2}
.close:hover{color:#fff;background:var(--red);box-shadow:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pane{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:14px}
.person{display:flex;gap:12px;align-items:flex-start;padding:10px;background:#0e0e0e;box-shadow:inset 0 0 0 1px #1d1d1d}
.person .av{width:34px;height:34px;flex:0 0 34px;background:#1d0505;box-shadow:inset 0 0 0 1px var(--edge);
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:13px;color:#ff7a7b}
.person .pn{display:block;font-size:13px;font-weight:500;line-height:1.35;color:var(--fg)}
.person .pr2{display:block;margin-top:5px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;line-height:1.4}
.log{font-size:11px;color:var(--dim);border-left:1px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.log b{color:var(--muted);font-weight:500}

/* ---------- notif / inbox ---------- */
.nrow{display:flex;gap:12px;padding:13px 14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);
  align-items:flex-start;width:100%;text-align:left;transition:.14s}
.nrow:hover{box-shadow:inset 0 0 0 1px var(--edge)}
.nrow.unread{background:linear-gradient(90deg,rgba(228,24,26,.1),var(--surface) 46%);box-shadow:inset 0 0 0 1px var(--edge)}
.nrow .ni{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;background:#1a0505;box-shadow:inset 0 0 0 1px var(--edge)}
.nrow .ni svg{width:15px;height:15px;stroke:var(--red);fill:none;stroke-width:1.7}
.nrow .nt{font-size:12.5px;line-height:1.5}
.nrow .nd{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.trig{display:inline-block;padding:1px 7px;font-size:9px;font-family:var(--disp);font-weight:700;letter-spacing:.14em;
  background:#1a0505;color:#ff5b5c;box-shadow:inset 0 0 0 1px var(--edge);clip-path:var(--cut-tag);margin-right:7px}
.trig.h0{background:var(--red);color:#fff;box-shadow:none}
.mailrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;padding:12px 14px;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);align-items:start}
.mailrow .sub{font-size:12.5px;font-weight:500}

const fShort = d => `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
const fTime = d => `${String(d.getHours()).padStart(2,"0")}.${String(d.getMinutes()).padStart(2,"0")}`;

/* ---------------- state (per-perangkat, localStorage) ---------------- */
const SKEY = "foresty2627.state.v1";
let STATE = {checks:{}, tasks:{}, read:[]};
try { const raw = localStorage.getItem(SKEY); if (raw) STATE = Object.assign(STATE, JSON.parse(raw)); } catch(e){}
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(STATE)); } catch(e){} }

const isChecked = (p, c) => STATE.checks?.[p.id]?.[c.id] ?? c.done;
function toggleCheck(pid, cid){
  const p = prog(pid), c = checksOf(p).find(x => x.id === cid);
  STATE.checks[pid] = STATE.checks[pid] || {};
  STATE.checks[pid][cid] = !isChecked(p, c);
  save();
}
const taskSt = (d, mid, t) => STATE.tasks?.[`${d.id}.${mid}.${t.id}`] ?? t.st;
function cycleTask(did, mid, tid){
  const d = DIVISIONS.find(x => x.id === did);
  const per = d.people.find(x => x.m === mid);
  const t = tasksOf(d, mid).find(x => x.id === tid);
  const order = ["todo","doing","done"];
  const next = order[(order.indexOf(taskSt(d, mid, t)) + 1) % 3];
  STATE.tasks[`${did}.${mid}.${tid}`] = next;
  save();
}
const progress = p => {
  const list = checksOf(p);
  const done = list.filter(c => isChecked(p, c)).length;
  return {done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0};
};

/* ---------------- notifikasi (H-3 / H-1 / H-0) ---------------- */
const RULES = [{d:3, l:"H-3"}, {d:1, l:"H-1"}, {d:0, l:"H-0"}];
function buildNotifs(){
  const now = new Date(), out = [];
  for (const p of PROGRAMS){
    if (p.status === "completed") continue;
    const when = dt(p.date);
    for (const r of RULES){
      const fire = new Date(when); fire.setDate(fire.getDate() - r.d); fire.setHours(7,0,0,0);
      if (fire > now) continue;
      const kata = r.d === 0 ? "hari ini" : r.d === 1 ? "besok" : `${r.d} hari lagi`;
      out.push({
        id:`${p.id}:${r.l}`, trig:r.l, fire, pid:p.id, kind:"event",
        text:`Reminder: <b>${esc(p.title)}</b> akan berlangsung ${kata}, ${fDate(when)} pukul ${fTime(when)} di ${esc(p.place)}.`
      });
    }
    for (const c of checksOf(p)){
      if (!c.due || isChecked(p, c)) continue;
      const due = dt(c.due);
      const fire = new Date(due); fire.setDate(fire.getDate() - 1); fire.setHours(7,0,0,0);
      if (fire > now) continue;
      const late = due < now;
      out.push({
        id:`${p.id}:${c.id}:due`, trig: late ? "OVERDUE" : "H-1", fire, pid:p.id, kind:"task", late,
        text: late
          ? `Terlambat: checklist <b>${esc(c.text)}</b> pada ${esc(p.title)} melewati tenggat ${fDate(due)} pukul ${fTime(due)}. PIC: ${esc(byId(c.who).name)}.`
          : `Tenggat besok: checklist <b>${esc(c.text)}</b> pada ${esc(p.title)} jatuh tempo ${fDate(due)} pukul ${fTime(due)}. PIC: ${esc(byId(c.who).name)}.`
      });
    }
  }
  return out.sort((a,b) => b.fire - a.fire);
}
const unreadCount = () => buildNotifs().filter(n => !STATE.read.includes(n.id)).length;

/* ---------------- events untuk kalender ---------------- */
function allEvents(){
  const ev = PROGRAMS.map(p => ({when: dt(p.date), title:p.title, pid:p.id, type:p.status, sub:p.place}));
  for (const p of PROGRAMS)
    for (const c of checksOf(p))
      if (c.due) ev.push({when: dt(c.due), title:`Deadline: ${c.text}`, pid:p.id,
        type: isChecked(p,c) ? "completed" : "ongoing", sub:`${p.title} · PIC ${byId(c.who).name}`});
  return ev.sort((a,b) => a.when - b.when);
}

function countdown(iso){
  return `<div class="cd num" data-ts="${dt(iso).getTime()}">
    <span data-u="d">--<b>Hari</b></span><span data-u="h">--<b>Jam</b></span><span data-u="m">--<b>Min</b></span><span data-u="s">--<b>Det</b></span></div>`;
}
function tickCountdowns(){
  const now = Date.now();
  document.querySelectorAll(".cd[data-ts]").forEach(el => {
    let ms = +el.dataset.ts - now;
    const past = ms < 0; ms = Math.abs(ms);
    const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60, s = Math.floor(ms/1e3)%60;
    const v = {d, h, m, s};
    el.querySelectorAll("span[data-u]").forEach(x => {
      x.firstChild.nodeValue = String(v[x.dataset.u]).padStart(2,"0");
    });
    el.classList.toggle("past", past);
    el.classList.toggle("urgent", !past && d < 2);
  });
}
setInterval(tickCountdowns, 1000);

function calendar(){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y, m, 1), start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  const events = allEvents(), today = key(new Date());
  const map = {};
  events.forEach(e => { (map[key(e.when)] = map[key(e.when)] || []).push(e); });

  let cells = "";
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = key(d), evs = map[k] || [];
    cells += `<button class="day${d.getMonth() !== m ? " out" : ""}${k === today ? " today" : ""}${k === calSel ? " sel" : ""}" data-day="${k}">

  const sel = calSel ? (map[calSel] || []) : [];

        : `<div class="meta">Tidak ada agenda pada tanggal ini.</div>`}
    </div>` : `<div class="day-detail"><div class="meta">Pilih tanggal untuk melihat detail agenda.</div></div>`;

  return `<div class="cal-head">
      <span class="mo">${MO[m]} ${y}</span>
      <button class="cal-nav" data-cal="-1" aria-label="Bulan sebelumnya">&lt;</button>
      <button class="cal-nav" data-cal="0" aria-label="Bulan ini">•</button>

    </div>
    <div class="cal">${["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(d => `<span class="dow">${d}</span>`).join("")}${cells}</div>
    ${detail}`;
}

function cdShort(d){
  const ms = d - new Date();
  if (ms < 0) return "Lewat " + Math.ceil(-ms / 864e5) + " hari";
  const days = Math.ceil(ms / 864e5);
  return days <= 1 ? "Kurang dari 24 jam" : "T-" + String(days).padStart(2,"0") + " hari";
}

let CURRENT = null;
function showModal(kind, id){
  CURRENT = {kind, id};
  closeModal();
  openModal(kind === "prog" ? modalProgram(id) : kind === "div" ? modalDivision(id) : modalMember(id));
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-tab],[data-open-prog],[data-open-div],[data-open-member],[data-check],[data-task],[data-cal],[data-day],[data-notif],[data-readall]");
  if (!t) return;
  const d = t.dataset;

  if (d.go) return go(d.go);
  if (d.tab){ progTab = d.tab; return render(); }
  if (d.openProg) return showModal("prog", d.openProg);
  if (d.openDiv) return showModal("div", d.openDiv);
  if (d.openMember) return showModal("member", d.openMember);
  if (d.check){
    const [pid, cid] = d.check.split("|");
    if (!canCheck(pid, cid)) return toast("Hanya PIC item ini atau pengurus inti yang dapat mengubahnya.");
    toggleCheck(pid, cid);
    showModal("prog", pid);
    return render0();
  }
  if (d.task){
    const [did, mid, tid] = d.task.split("|");
    if (!canTask(mid)) return toast("Kamu hanya dapat mengubah tugas atas namamu sendiri.");
    cycleTask(did, mid, tid);
    if (CURRENT && CURRENT.kind === "member") showModal("member", CURRENT.id);
    else showModal("div", did);
    return render0();
  }
  if (d.cal !== undefined){
    if (d.cal === "0") { const n = new Date(); calCursor = new Date(n.getFullYear(), n.getMonth(), 1); }
    else calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + Number(d.cal), 1);
    return render();
  }
  if (d.day){ calSel = calSel === d.day ? null : d.day; return render(); }
  if (d.notif){
    if (!STATE.read.includes(d.notif)){ STATE.read.push(d.notif); save(); }
    render();
    return showModal("prog", d.pid);
  }
  if (d.readall !== undefined){
    STATE.read = Array.from(new Set([...STATE.read, ...buildNotifs().map(n => n.id)]));
    save();
    return render();
  }
});

  railBtn.setAttribute("aria-expanded", String(!on));
  railBtn.setAttribute("aria-label", on ? "Tampilkan menu" : "Sembunyikan menu");
  railBtn.title = on ? "Tampilkan menu" : "Sembunyikan menu";
  try { localStorage.setItem(RKEY, on ? "1" : "0"); } catch(e){}
}
railBtn.addEventListener("click", () => setRail(!shellEl.classList.contains("rail")));
try { if (localStorage.getItem(RKEY) === "1") setRail(true); } catch(e){}

setInterval(() => { const c = $("#clock"); if (c) c.textContent = fTime(new Date()); }, 1000);

function boot(){
  route = (location.hash.replace("#","") || "dashboard");
  if (!visibleMenu().some(m => m.id === route)) route = "dashboard";
  render();
}
</script>
<script>
/* ============================================================
   AUTENTIKASI (PROTOTIPE — data disimpan di browser, bukan server)
   Alur: daftar -> pilih nama -> menunggu ACC akun lab -> aktif.
   Password di sini adalah password AKUN WEB, bukan password Gmail.
   ============================================================ */

const LAB_EMAIL_ACC = "forestylab@gmail.com";
const LAB_PASS_DEMO = "foresty2627";           // hanya untuk prototipe

/* Pengurus inti + koordinator divisi: akses penuh.
   Sisanya (staff & tim riset): hanya item atas namanya sendiri. */
const INTI_IDS = ["m01","m02","m03","m04","m05","m10","m15","m20"];
const levelOf = id => INTI_IDS.includes(id) ? "inti" : "staff";
const LEVEL_LABEL = {lab:"Akun Lab · Admin", inti:"Akses Penuh", staff:"Akses Terbatas"};

const AKEY = "foresty2627.auth.v1";
let AUTH = {accounts: [], session: null};
try { const r = localStorage.getItem(AKEY); if (r) AUTH = Object.assign(AUTH, JSON.parse(r)); } catch(e){}
function saveAuth(){ try { localStorage.setItem(AKEY, JSON.stringify(AUTH)); } catch(e){} }

const acctByEmail = e => AUTH.accounts.find(a => a.email.toLowerCase() === String(e).toLowerCase());
const approvedFor = mid => AUTH.accounts.find(a => a.memberId === mid && a.status === "approved");
const pendingList = () => AUTH.accounts.filter(a => a.status === "pending");
const activeList  = () => AUTH.accounts.filter(a => a.status === "approved");

function session(){
  if (!AUTH.session) return null;
  if (AUTH.session.kind === "lab") return {kind:"lab", member:null, level:"lab"};
  const a = acctByEmail(AUTH.session.email);
  if (!a || a.status !== "approved") return null;
  return {kind:"member", account:a, member: byId(a.memberId), level: levelOf(a.memberId)};
}
const isLab  = () => session()?.kind === "lab";
const myId   = () => session()?.member?.id || null;
const canAll = () => { const s = session(); return !!s && (s.kind === "lab" || s.level === "inti"); };
const canCheck = (pid, cid) => {
  if (canAll()) return true;
  const c = checksOf(prog(pid)).find(x => x.id === cid);
  return !!c && c.who === myId();
};
const canTask = mid => canAll() || mid === myId();

/* ---- gabungan data bawaan + item yang ditambahkan pengguna ---- */
function checksOf(p){ return p.checklist.concat(STATE.extraChecks?.[p.id] || []); }
function tasksOf(d, mid){
  const base = d.people.find(x => x.m === mid)?.tasks || [];
  return base.concat(STATE.extraTasks?.[`${d.id}.${mid}`] || []);
}
function addCheck(pid, text, who){
  STATE.extraChecks = STATE.extraChecks || {};
  (STATE.extraChecks[pid] = STATE.extraChecks[pid] || []).push({id:"x" + Date.now(), text, who});
  save();
}
function addTask(did, mid, text){
  STATE.extraTasks = STATE.extraTasks || {};
  (STATE.extraTasks[`${did}.${mid}`] = STATE.extraTasks[`${did}.${mid}`] || []).push({id:"x" + Date.now(), text, st:"todo"});
  save();
}

/* ---------------- menu & identitas ---------------- */
function visibleMenu(){
  return isLab() ? MENU.concat([{id:"approval", label:"Approval",
    icon:'<path d="M4 12l5 5L20 6"/><path d="M4 5h9"/>'}]) : MENU;
}
function paintUser(){
  const s = session(), el = $("#me");
  if (!el || !s) return;
  const nama = s.kind === "lab" ? "Akun Lab" : s.member.name;
  const sub  = s.kind === "lab" ? "Administrator" : s.member.role;
  const inis = s.kind === "lab" ? "FL" : ini(s.member.name);
  const pend = isLab() ? pendingList().length : 0;
  el.innerHTML = `<div class="av">${inis}</div>
    <div>
      <div class="mn">${esc(nama)}</div>
      <div class="mr">${esc(sub)}</div>
    </div>
    ${pend ? `<span class="tag t-over" style="margin-left:4px">${pend} menunggu</span>` : ""}
    <button class="logout" id="logout" title="Keluar" aria-label="Keluar">
      <svg viewBox="0 0 24 24"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
    </button>`;
  $("#logout").addEventListener("click", () => { AUTH.session = null; saveAuth(); gate(); });
}

/* ---------------- toast ---------------- */
let toastT;
function toast(msg){
  let el = $("#toast");
  if (!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2600);
}

/* ---------------- layar autentikasi ---------------- */
let authScreen = "login", authErr = "", authNotice = "";

function authShell(inner){
  return `<div class="authwrap">
    <div class="authbox">
      <div class="dots"></div><div class="scan"></div>
      <div class="authhead">
        <img src="logo.png" alt="Logo Foresty Laboratory" width="46" height="65">
        <div>
          <div class="bt" style="font-family:var(--disp);font-weight:700;letter-spacing:.13em;font-size:15px;line-height:1.15">FORESTY<br>LABORATORY</div>
          <div class="bs" style="font-size:9.5px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase">Forensics &amp; Security</div>
        </div>
      </div>
      <span class="labshow" style="margin:0 0 18px">FORESTY MANAGEMENT</span>
      ${inner}
    </div>
  </div>`;
}

function viewLogin(){
  const claimable = MEMBERS.filter(m => !approvedFor(m.id)).length;
  return authShell(`
    <h2 style="margin-bottom:4px">Masuk</h2>
    <p class="meta" style="margin-bottom:18px">Gunakan email yang sudah disetujui akun lab.</p>
    ${authNotice ? `<div class="anotice">${authNotice}</div>` : ""}
    ${authErr ? `<div class="aerr">${esc(authErr)}</div>` : ""}
    <form class="aform" id="loginForm">
      <label class="afield"><span class="label">Email</span>
        <input id="li-email" type="email" autocomplete="username" placeholder="nama@email.com" required></label>
      <label class="afield"><span class="label">Password akun web</span>
        <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:4px">Masuk</button>
    </form>
    <div class="aalt">Belum punya akun? <button data-auth="register">Daftar di sini</button>
      <span class="meta" style="display:block;margin-top:5px">${claimable} nama masih tersedia untuk diklaim.</span></div>
    <div class="ahint"><b>Prototipe:</b> akun lab <code>${LAB_EMAIL_ACC}</code> · password <code>${LAB_PASS_DEMO}</code>. Ganti saat backend asli dipasang.</div>`);
}

function viewRegister(){
  const opts = MEMBERS.filter(m => !approvedFor(m.id)).map(m => {
    const waiting = pendingList().filter(a => a.memberId === m.id).length;
    return `<option value="${m.id}">${esc(m.name)} — ${esc(m.role)}${waiting ? ` (${waiting} menunggu ACC)` : ""}</option>`;
  }).join("");
  return authShell(`
    <h2 style="margin-bottom:4px">Daftar Akun</h2>
    <p class="meta" style="margin-bottom:18px">Daftarkan email, lalu pilih namamu dari daftar pengurus supaya akun ini menempel ke datamu.</p>
    ${authErr ? `<div class="aerr">${esc(authErr)}</div>` : ""}
    <form class="aform" id="regForm">
      <label class="afield"><span class="label">Email</span>
        <input id="rg-email" type="email" autocomplete="username" placeholder="nama@email.com" required></label>
      <label class="afield"><span class="label">Password akun web</span>
        <input id="rg-pass" type="password" autocomplete="new-password" placeholder="minimal 8 karakter" required></label>
      <label class="afield"><span class="label">Ulangi password</span>
        <input id="rg-pass2" type="password" autocomplete="new-password" placeholder="••••••••" required></label>
      <label class="afield"><span class="label">Nama kamu</span>
        <select id="rg-member" required><option value="">— pilih nama —</option>${opts}</select></label>
      <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:4px">Kirim Pendaftaran</button>
    </form>
    <div class="ahint"><b>Password ini password akun web Foresty Management</b>, bukan password Gmail kamu. Jangan pernah memasukkan password Gmail di halaman mana pun.</div>
    <div class="aalt">Sudah punya akun? <button data-auth="login">Masuk</button></div>`);
}

function viewPending(email){
  const a = acctByEmail(email), m = byId(a.memberId);
  return authShell(`
    <div class="await-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h2 style="margin-bottom:4px">Menunggu Persetujuan</h2>
    <p class="meta" style="margin-bottom:18px">Pendaftaran sudah terkirim. Akun lab perlu menyetujui dulu sebelum kamu bisa masuk.</p>
    <div class="pane" style="margin-bottom:16px">
      <div class="kv"><span class="k">Email</span><span>${esc(a.email)}</span></div>
      <div class="kv"><span class="k">Nama</span><span>${esc(m.name)}</span></div>
      <div class="kv"><span class="k">Jabatan</span><span>${esc(m.role)}</span></div>
      <div class="kv"><span class="k">Dikirim</span><span class="num">${fShort(dt(a.at))} ${fTime(dt(a.at))}</span></div>
      <div class="kv"><span class="k">Status</span><span style="color:var(--warn)">Menunggu ACC ${LAB_EMAIL_ACC}</span></div>
    </div>
    <button class="btn ghost" data-auth="login" style="width:100%;justify-content:center">Kembali ke halaman masuk</button>`);
}

function viewRejected(email){
  const a = acctByEmail(email), m = byId(a.memberId);
  return authShell(`
    <div class="await-ic rej"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div>
    <h2 style="margin-bottom:4px">Pendaftaran Ditolak</h2>
    <p class="meta" style="margin-bottom:16px">Akun lab menolak pendaftaran email <b style="color:#fff">${esc(a.email)}</b> atas nama ${esc(m.name)}.</p>
    ${a.reason ? `<div class="anotice" style="border-left-color:var(--red)"><b>Alasan:</b> ${esc(a.reason)}</div>` : ""}
    <button class="btn" data-auth="reset|${esc(a.email)}" style="width:100%;justify-content:center;margin-top:6px">Daftar ulang</button>
    <button class="btn ghost" data-auth="login" style="width:100%;justify-content:center;margin-top:8px">Kembali</button>`);
}

/* ---------------- menu Approval (khusus akun lab) ---------------- */
function viewApproval(){
  if (!isLab()) return `<div class="empty">Halaman ini hanya untuk akun lab.</div>`;
  const pend = pendingList();
  const dupes = {};
  pend.forEach(a => dupes[a.memberId] = (dupes[a.memberId] || 0) + 1);

  const queue = pend.map(a => {
    const m = byId(a.memberId), bentrok = dupes[a.memberId] > 1;
    return `<div class="card" style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1;min-width:210px">
        ${bentrok ? `<span class="tag t-over" style="margin-bottom:8px">${dupes[a.memberId]} orang mengklaim nama ini</span>` : ""}
        <div class="kv"><span class="k">Email</span><span>${esc(a.email)}</span></div>
        <div class="kv"><span class="k">Mengaku</span><span style="color:#fff">${esc(m.name)}</span></div>
        <div class="kv"><span class="k">Jabatan</span><span>${esc(m.role)} · ${esc(m.div)}</span></div>
        <div class="kv"><span class="k">Dikirim</span><span class="num">${fShort(dt(a.at))} ${fTime(dt(a.at))}</span></div>
      </div>
      <div style="flex:0 0 240px;display:flex;flex-direction:column;gap:8px">
        <input class="ainput" id="rsn-${esc(a.email)}" placeholder="Alasan penolakan (opsional)">
        <div style="display:flex;gap:8px">
          <button class="btn sm" data-appr="ok|${esc(a.email)}" style="flex:1;justify-content:center">Setujui</button>
          <button class="btn ghost sm" data-appr="no|${esc(a.email)}" style="flex:1;justify-content:center">Tolak</button>
        </div>
      </div>
    </div>`;
  }).join("") || `<div class="empty">Tidak ada pendaftaran yang menunggu.</div>`;

  const active = activeList().map(a => {
    const m = byId(a.memberId);
    return `<div class="mailrow" style="grid-template-columns:30px minmax(0,1fr) auto auto;gap:12px;align-items:center">
      <span class="av-s" style="margin:0">${ini(m.name)}</span>
      <span style="min-width:0"><span class="sub">${esc(m.name)}</span><span class="snip">${esc(a.email)}</span></span>
      <span class="tag ${levelOf(m.id) === "inti" ? "t-ongoing" : "t-soon"}">${LEVEL_LABEL[levelOf(m.id)]}</span>
      <button class="btn ghost sm" data-appr="cabut|${esc(a.email)}">Cabut</button>
    </div>`;
  }).join("") || `<div class="empty">Belum ada akun aktif.</div>`;

  const belum = MEMBERS.filter(m => !approvedFor(m.id));

  return `<div class="sec-head"><div><div class="kick">Khusus ${LAB_EMAIL_ACC}</div><h1>Approval</h1>
      <p class="sec-sub">Setujui atau tolak pendaftaran akun. Email baru resmi menempel ke nama pengurus setelah disetujui di sini.</p></div></div>
    <div class="rule"></div>
    <div class="grid g-sum" style="margin-bottom:24px">
      ${stat("Menunggu Persetujuan", pend.length, pend.length ? "red" : "", "pendaftaran masuk")}
      ${stat("Akun Aktif", activeList().length, "ok", "sudah bisa login")}
      ${stat("Nama Belum Diklaim", belum.length, "", "dari " + MEMBERS.length + " pengurus")}
    </div>
    <div class="label" style="margin-bottom:12px">Antrean Pendaftaran</div>
    <div class="stack" style="gap:12px;margin-bottom:30px">${queue}</div>
    <div class="label" style="margin-bottom:12px">Akun Aktif</div>
    <div class="stack">${active}</div>`;
}

/* ---------------- gate ---------------- */
function gate(){
  const s = session(), root = $("#authRoot"), shell = $("#shell");
  if (s){
    root.innerHTML = ""; root.hidden = true;
    shell.hidden = false;
    if (route === "approval" && !isLab()) route = "dashboard";
    boot(); paintUser();
    return;
  }
  shell.hidden = true; root.hidden = false;
  const v = authScreen;
  root.innerHTML = v === "register" ? viewRegister()
    : v.startsWith("pending:")  ? viewPending(v.slice(8))
    : v.startsWith("rejected:") ? viewRejected(v.slice(9))
    : viewLogin();
  authErr = ""; authNotice = "";
  wireAuthForms();
}

function wireAuthForms(){
  const lf = $("#loginForm");
  if (lf) lf.addEventListener("submit", e => {
    e.preventDefault();
    const email = $("#li-email").value.trim(), pass = $("#li-pass").value;
    if (email.toLowerCase() === LAB_EMAIL_ACC && pass === LAB_PASS_DEMO){
      AUTH.session = {kind:"lab"}; saveAuth(); route = "approval"; return gate();
    }
    const a = acctByEmail(email);
    if (!a || a.pass !== pass){ authErr = "Email atau password tidak cocok."; authScreen = "login"; return gate(); }
    if (a.status === "pending"){ authScreen = "pending:" + a.email; return gate(); }
    if (a.status === "rejected"){ authScreen = "rejected:" + a.email; return gate(); }
    AUTH.session = {kind:"member", email:a.email}; saveAuth(); route = "dashboard"; gate();
  });

  const rf = $("#regForm");
  if (rf) rf.addEventListener("submit", e => {
    e.preventDefault();
    const email = $("#rg-email").value.trim(), p1 = $("#rg-pass").value, p2 = $("#rg-pass2").value;
    const mid = $("#rg-member").value;
    authScreen = "register";
    if (email.toLowerCase() === LAB_EMAIL_ACC){ authErr = "Email ini dipakai akun lab dan tidak bisa didaftarkan."; return gate(); }
    if (acctByEmail(email)){ authErr = "Email ini sudah pernah didaftarkan."; return gate(); }
    if (p1.length < 8){ authErr = "Password minimal 8 karakter."; return gate(); }
    if (p1 !== p2){ authErr = "Ulangi password belum sama."; return gate(); }
    if (!mid){ authErr = "Pilih dulu namamu dari daftar."; return gate(); }
    AUTH.accounts.push({email, pass:p1, memberId:mid, status:"pending", at:new Date().toISOString()});
    saveAuth();
    authScreen = "pending:" + email; gate();
  });
}

/* klik pada layar auth + menu approval */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-auth],[data-appr]");
  if (!t) return;
  if (t.dataset.auth){
    const [act, arg] = t.dataset.auth.split("|");
    if (act === "reset"){ AUTH.accounts = AUTH.accounts.filter(a => a.email !== arg); saveAuth(); authScreen = "register"; }
    else authScreen = act;
    return gate();
  }
  const [act, email] = t.dataset.appr.split("|");
  const a = acctByEmail(email);
  if (!a) return;
  if (act === "ok"){ a.status = "approved"; delete a.reason; toast(`${byId(a.memberId).name} disetujui — akun ${a.email} aktif.`); }
  if (act === "no"){
    const r = document.getElementById("rsn-" + email);
    a.status = "rejected"; a.reason = r && r.value.trim() ? r.value.trim() : "";
    toast(`Pendaftaran ${a.email} ditolak.`);
  }
  if (act === "cabut"){
    AUTH.accounts = AUTH.accounts.filter(x => x.email !== email);
    toast(`Akses ${email} dicabut. Namanya bisa diklaim lagi.`);
  }
  saveAuth(); render(); paintUser();
});

/* form tambah item / tugas */
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.dataset.addcheck){
    e.preventDefault();
    const pid = f.dataset.addcheck, txt = f.text.value.trim();
    if (!txt) return;
    addCheck(pid, txt, f.who.value);
    showModal("prog", pid); render0();
    toast("Item checklist ditambahkan.");
  }
  if (f.dataset.addtask){
    e.preventDefault();
    const [did, mid] = f.dataset.addtask.split("|"), txt = f.text.value.trim();
    if (!txt) return;
    if (!canTask(mid)) return toast("Kamu hanya dapat menambah tugas atas namamu sendiri.");
    addTask(did, mid, txt);
    if (CURRENT && CURRENT.kind === "member") showModal("member", CURRENT.id); else showModal("div", did);
    render0();
    toast("Tugas ditambahkan.");
  }
});

gate();
</script>
